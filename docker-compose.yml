services:
  ai-dev-env-local:
    tty: true
    # Uses Ollama running on the host machine
    env_file:
      - .env
      - .env.public
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ANTHROPIC_API_KEY=${OLLAMA_API_KEY}
      - ANTHROPIC_BASE_URL=http://host.docker.internal:11434
      - ANTHROPIC_AUTH_TOKEN=ollama
    volumes:
      # Git SSH keys
      - ./keys/git/id_ed25519:/home/developer/.ssh-host/id_ed25519:ro
      - ./keys/git/id_ed25519.pub:/home/developer/.ssh-host/id_ed25519.pub:ro
