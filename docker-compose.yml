services:
  ai-dev-env:
    env_file:
      - .env
      - .env.public
    build:
      context: .
      dockerfile: Dockerfile
    tty: true
    stdin_open: true
    ports:
      - "11434:11434"
    environment:
      - ANTHROPIC_API_KEY=${OLLAMA_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
    volumes:
      - ollama_data:/root/.ollama
      # Ollama auth
      - ./keys/ollama/id_ed25519:/root/.ollama/id_ed25519:ro
      - ./keys/ollama/id_ed25519.pub:/root/.ollama/id_ed25519.pub:ro
      # Git SSH keys
      - ./keys/git/id_ed25519:/root/.ssh-host/id_ed25519:ro
      - ./keys/git/id_ed25519.pub:/root/.ssh-host/id_ed25519.pub:ro
    restart: unless-stopped

volumes:
  ollama_data:
