services:
  ai-dev-env:
    # tty: true 
    env_file:
      - .env
      - .env.public
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "11434:11434"
    environment:
      - ANTHROPIC_API_KEY=${OLLAMA_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
    volumes:
      - ollama_data:/home/developer/.ollama
      # Ollama auth
      - ./keys/ollama/id_ed25519:/home/developer/.ollama/id_ed25519:ro
      - ./keys/ollama/id_ed25519.pub:/home/developer/.ollama/id_ed25519.pub:ro
      # Git SSH keys
      - ./keys/git/id_ed25519:/home/developer/.ssh-host/id_ed25519:ro
      - ./keys/git/id_ed25519.pub:/home/developer/.ssh-host/id_ed25519.pub:ro

volumes:
  ollama_data:
